name: Viral Meme Pipeline

on:
  schedule:
    - cron: '0 10,18 * * *'
  workflow_dispatch:  # manual run from the Actions tab

env:
  GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}

jobs:
  produce-memes:
    name: Produce memes (daily batch)
    runs-on: windows-latest
    timeout-minutes: 150
    concurrency:
      group: viral-meme-pipeline
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements --silent
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          }
          ffmpeg -version | Select-Object -First 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install CPU torch first so it does not pull the 2.5GB CUDA binary
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Write credentials from GitHub Secrets
        run: |
          $ErrorActionPreference = 'Stop'
          $envOut = @()
          if ($env:GOOGLE_DRIVE_FOLDER_ID) { $envOut += "GOOGLE_DRIVE_FOLDER_ID=$env:GOOGLE_DRIVE_FOLDER_ID" }
          if ($env:GOOGLE_OAUTH_CLIENT_ID)  { $envOut += "GOOGLE_OAUTH_CLIENT_ID=$env:GOOGLE_OAUTH_CLIENT_ID" }
          if ($env:GOOGLE_OAUTH_CLIENT_SECRET) { $envOut += "GOOGLE_OAUTH_CLIENT_SECRET=$env:GOOGLE_OAUTH_CLIENT_SECRET" }
          if ($envOut.Count -gt 0) { Set-Content -Path .env -Value $envOut -Encoding UTF8 }
          if ($env:GOOGLE_OAUTH_TOKEN) {
            $decoded = [Convert]::FromBase64String($env:GOOGLE_OAUTH_TOKEN)
            [IO.File]::WriteAllBytes('google_oauth_token.json', $decoded)
          }
          if (Test-Path .env) {
            Get-Content .env
          } else {
            Write-Host "No Google credentials provided; running in local/artifact mode."
          }
        shell: pwsh

      - name: Verify tools
        run: |
          ffmpeg -version | Select-Object -First 1
          python -c "import yt_dlp, moviepy, requests; print('core ok')"
          python -c "from google.oauth2.credentials import Credentials; print('oauth ok')"

      - name: Harvest + edit + upload
        id: pipeline
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'actions.log'
          $start = Get-Date
          try {
            python main.py --harvest --max 3 --keep-local | Tee-Object -FilePath $log
          } catch {
            Write-Warning "Pipeline raised: $_"
          }
          $end = Get-Date
          $ms = ([DateTime]::UtcNow - $start).TotalSeconds
          Write-Host "PIPELINE_DURATION_SECONDS=$ms"
        shell: pwsh

      - name: Collect renders
        if: always()
        run: |
          if (Test-Path output) {
            $items = Get-ChildItem output -Filter '*.mp4' -ErrorAction SilentlyContinue
            if ($items) {
              $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'
              $zip = "memes_$stamp.zip"
              Compress-Archive -Path output\*.mp4 -DestinationPath $zip
              Write-Host "PIPELINE_RENDER_COUNT=$($items.Count)"
            }
          }
        shell: pwsh

      - name: Upload renders to Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-renders
          path: memes_*.zip
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if (Test-Path actions.log) {
            $log = Get-Content actions.log
            if ($log -match 'PIPELINE DONE') {
              Write-Host '✅ Batch complete'
            } else {
              Write-Host '❌ Batch failed — see actions.log'
            }
            $log | Select-Object -Last 15
          } else {
            Write-Host '⚠️ actions.log not found'
          }
        shell: pwsh
