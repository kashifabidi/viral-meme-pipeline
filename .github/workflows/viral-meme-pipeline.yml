name: Viral Meme Pipeline

on:
  schedule:
    - cron: '0 10,18 * * *'
  workflow_dispatch:  # manual run from the Actions tab

env:
  GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

jobs:
  produce-memes:
    name: Produce memes (daily batch)
    runs-on: windows-latest
    timeout-minutes: 150
    concurrency:
      group: viral-meme-pipeline
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Ensure FFmpeg in PATH
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "ffmpeg not in PATH; installing via chocolatey..."
            choco install ffmpeg --no-progress
          }
          $cmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($cmd) {
            Write-Host "FFmpeg binary located at: $($cmd.Source)"
          } else {
            Write-Warning "FFmpeg not found in standard lookup; checking Chocolatey bin..."
            if (Test-Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe") {
              "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install CPU torch first so it does not pull the 2.5GB CUDA binary
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --upgrade yt-dlp

      - name: Write credentials from GitHub Secrets
        run: |
          $ErrorActionPreference = 'Stop'
          $envOut = @()
          if ($env:GOOGLE_DRIVE_FOLDER_ID) { $envOut += "GOOGLE_DRIVE_FOLDER_ID=$env:GOOGLE_DRIVE_FOLDER_ID" }
          if ($env:GOOGLE_OAUTH_CLIENT_ID)  { $envOut += "GOOGLE_OAUTH_CLIENT_ID=$env:GOOGLE_OAUTH_CLIENT_ID" }
          if ($env:GOOGLE_OAUTH_CLIENT_SECRET) { $envOut += "GOOGLE_OAUTH_CLIENT_SECRET=$env:GOOGLE_OAUTH_CLIENT_SECRET" }
          if ($envOut.Count -gt 0) { Set-Content -Path .env -Value $envOut -Encoding UTF8 }
          if ($env:GOOGLE_OAUTH_TOKEN) {
            try {
              $decoded = [Convert]::FromBase64String($env:GOOGLE_OAUTH_TOKEN)
              [IO.File]::WriteAllBytes('google_oauth_token.json', $decoded)
            } catch {
              Set-Content -Path 'google_oauth_token.json' -Value $env:GOOGLE_OAUTH_TOKEN -Encoding UTF8
            }
          }
          if ($env:YOUTUBE_COOKIES) {
            Set-Content -Path 'cookies.txt' -Value $env:YOUTUBE_COOKIES -Encoding UTF8
            Write-Host "Configured YouTube cookies from repository secret."
          }
          if (Test-Path .env) {
            Get-Content .env
          } else {
            Write-Host "No Google credentials provided; running in local/artifact mode."
          }
        shell: pwsh

      - name: Verify tools
        run: |
          ffmpeg -version | Select-Object -First 1
          python -c "import yt_dlp, moviepy, requests; print('core ok')"
          python -c "from google.oauth2.credentials import Credentials; print('oauth ok')"

      - name: Harvest + edit + upload
        id: pipeline
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'actions.log'
          $start = Get-Date
          try {
            python main.py --harvest --max 3 --keep-local 2>&1 | Tee-Object -FilePath $log
          } catch {
            Write-Warning "Pipeline raised: $_"
          }
          $end = Get-Date
          $ms = ([DateTime]::UtcNow - $start).TotalSeconds
          Write-Host "PIPELINE_DURATION_SECONDS=$ms"
        shell: pwsh

      - name: Collect renders
        if: always()
        run: |
          if (Test-Path output) {
            $items = Get-ChildItem output -Filter '*.mp4' -ErrorAction SilentlyContinue
            if ($items) {
              $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'
              $zip = "memes_$stamp.zip"
              Compress-Archive -Path output\*.mp4 -DestinationPath $zip
              Write-Host "PIPELINE_RENDER_COUNT=$($items.Count)"
            }
          }
        shell: pwsh

      - name: Upload renders to Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-renders
          path: memes_*.zip
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if (Test-Path actions.log) {
            $logLines = Get-Content actions.log
            $logRaw = Get-Content actions.log -Raw
            if ($logRaw -match 'PIPELINE DONE' -and $logRaw -match '[1-9]\d* ok') {
              Write-Host '✅ Batch complete: videos successfully generated & published.'
            } elseif ($logRaw -match 'PIPELINE DONE') {
              Write-Host '⚠️ Batch finished, but 0 videos produced.'
            } else {
              Write-Host '❌ Batch failed to complete — see actions.log'
            }
            $logLines | Select-Object -Last 25
          } else {
            Write-Host '⚠️ actions.log not found'
          }
        shell: pwsh
